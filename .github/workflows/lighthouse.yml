name: Lighthouse CI

on:
  pull_request:
    branches: [main]

# SECURITY: Explicit least-privilege permissions
permissions:
  contents: read
  pull-requests: write  # Required for PR comments with Lighthouse results

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SECURITY: Pinned to SHA for supply chain security
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        # SECURITY: Pinned to SHA
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Audit with Lighthouse CI
        # SECURITY: Pinned to SHA
        uses: treosh/lighthouse-ci-action@2dd68ab12619d615e69ce5982eb20be9a6883ae0 # v12
        with:
          uploadArtifacts: true
          # SECURITY: Disabled public storage - use GitHub artifacts only
          temporaryPublicStorage: false
          configPath: .github/lighthouse/lighthouserc.json
