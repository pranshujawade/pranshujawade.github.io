name: Syndicate Content

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
  workflow_dispatch:

# SECURITY: Explicit least-privilege permissions
permissions:
  contents: write  # Required for git push of syndication state

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SECURITY: Pinned to SHA for supply chain security
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # SECURITY: Pinned to SHA
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Identify new/changed blog posts
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger: process all blog posts
            # SECURITY: Use find with -print0 and proper quoting
            FILES=$(find src/content/blog -name "*.mdx" -o -name "*.md" | tr '\n' ' ')
          else
            # Push trigger: only process changed files
            # SECURITY: Quote SHA variables to prevent injection
            FILES=$(git diff --name-only --diff-filter=ACM "${{ github.event.before }}" "${{ github.sha }}" -- src/content/blog/ | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed files: $FILES"

      - name: Run syndication
        if: steps.changed-files.outputs.files != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          SITE_URL: https://pranshujawade.github.io
          # SECURITY: Pass files via environment variable, not command line
          SYNDICATE_FILES: ${{ steps.changed-files.outputs.files }}
        # SECURITY: Read files from env var to prevent command injection
        run: node scripts/syndicate.mjs

      - name: Commit syndication state
        if: steps.changed-files.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet .data/; then
            echo "No syndication state changes to commit."
          else
            git add .data/syndication-state.json
            git commit -m "chore: update syndication state"
            git push
          fi
